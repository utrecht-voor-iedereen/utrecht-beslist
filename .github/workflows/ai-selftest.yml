# Comprueba que los modelos de IA configurados siguen respondiendo, sin tocar
# el sitio. Lanzar a mano tras cambiar de modelo o de clave, y una vez por
# semana: un proveedor que retira un modelo avisa aquí antes de que el
# pipeline pase días sin resumir nada.
name: IA · autodiagnóstico

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 0'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probar cada modelo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m scripts.ai_selftest
