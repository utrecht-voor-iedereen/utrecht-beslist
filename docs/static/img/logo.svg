<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-label="Utrecht Beslist — City Council in Plain Language">
  <defs>
    <!-- Upper-Left Red Half Clip Polygon -->
    <clipPath id="clip-top-left">
      <polygon points="0,0 80,0 0,80" />
    </clipPath>

    <!-- Lower-Right White Half Clip Polygon -->
    <clipPath id="clip-bottom-right">
      <polygon points="80,0 80,80 0,80" />
    </clipPath>

    <!-- Shield Outline Path -->
    <path id="shield-path" d="M36 4 L62 12 V42 C62 58 50 71 36 76 C22 71 10 58 10 42 V12 Z" />
  </defs>

  <!-- Shield Red Upper-Left Fill -->
  <use href="#shield-path" fill="#CC0000" clip-path="url(#clip-top-left)" />

  <!-- Shield White Lower-Right Fill -->
  <use href="#shield-path" fill="#FFFFFF" clip-path="url(#clip-bottom-right)" />

  <!-- Shield Black Contour Outline -->
  <use href="#shield-path" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Checkmark on Red Half (White Stroke) -->
  <polyline points="22,42 31,51 50,28" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#clip-top-left)" />

  <!-- Checkmark on White Half (Black Stroke) -->
  <polyline points="22,42 31,51 50,28" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#clip-bottom-right)" />

  <!-- Wordmark Title -->
  <text x="84" y="42" font-family="system-ui, Arial, sans-serif" font-size="30" font-weight="700" xml:space="preserve"><tspan fill="#000000">Utrecht </tspan><tspan fill="#CC0000">Beslist</tspan><tspan fill="#FFCC00">.</tspan></text>

  <!-- Subtitle -->
  <text x="85" y="63" font-family="system-ui, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="#757575">CITY COUNCIL IN PLAIN LANGUAGE</text>
</svg>
