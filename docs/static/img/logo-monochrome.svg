<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-label="Utrecht Beslist — Monochrome Logo">
  <defs>
    <!-- Shield Outline Path -->
    <path id="shield-path-mono" d="M36 4 L62 12 V42 C62 58 50 71 36 76 C22 71 10 58 10 42 V12 Z" />
  </defs>

  <!-- Shield Filled Solid -->
  <use href="#shield-path-mono" fill="currentColor" opacity="0.15" />

  <!-- Shield Outline -->
  <use href="#shield-path-mono" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Checkmark Cutout -->
  <polyline points="22,42 31,51 50,28" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark Title -->
  <text x="84" y="42" font-family="system-ui, Arial, sans-serif" font-size="30" font-weight="700" fill="currentColor" xml:space="preserve">Utrecht Beslist.</text>

  <!-- Subtitle -->
  <text x="85" y="63" font-family="system-ui, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="currentColor" opacity="0.75">CITY COUNCIL IN PLAIN LANGUAGE</text>
</svg>
